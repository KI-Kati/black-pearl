<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Black Pearl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Black Pearl">
<meta name="theme-color" content="#0b1622">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="bilder/icon-180.png">
<link rel="icon" href="bilder/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b1622; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #rand { position: fixed; visibility: hidden; pointer-events: none;
          padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* Oben im Bild, damit die Bildschirmtastatur das Feld nicht verdeckt. */
  #namensfeld { display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: min(92vw, 460px); box-sizing: border-box;
                flex-direction: column; gap: 8px; padding: 12px 16px; background: rgba(10,10,24,.96); border: 3px solid #ffe182; border-radius: 12px; color: #ffe182; font-weight: 700; text-align: center; }
  #namensfeld input { font: 700 18px "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; text-align: center; -webkit-user-select: text; user-select: text; }
  #namensfeld .zeile { display: flex; gap: 8px; }
  #namensfeld button { flex: 1; min-height: 44px; font: 700 16px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; background: #16263a; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; }
  #namensfeld #name_ok { background: #2f7fb5; }
</style>
</head>
<body>
<canvas id="feld"></canvas>
<div id="rand"></div>
<div id="namensfeld">
  <div id="name_titel"></div>
  <input id="name" type="text" maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Name">
  <div class="zeile"><button id="name_ok" type="button">Speichern</button><button id="name_ohne" type="button">Ohne Namen</button></div>
</div>
<script data-goatcounter="https://ki-kati.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script src="daten.js"></script>
<script src="grafik.js"></script>
<script src="klang.js"></script>
<script src="spiel.js"></script>
<script src="weltbild.js"></script>
<script src="steuerung.js"></script>
</body>
</html>
